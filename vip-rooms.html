<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>貴賓室使用狀況表</title>
<style>
  :root{
    --paper:#f7f4ee; --paper-line:#ddd5c5; --ink:#22303c;
    --navy:#1c2b3a; --navy-light:#3c5570; --gold:#b98a2f; --gold-light:#d8b25f;
    --ok:#2e7d4f; --warn:#b3541e; --danger:#a63232; --am:#eaf2ee; --pm:#f2ede2;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif; background:var(--paper); color:var(--ink); }
  .wrap{ max-width:1400px; margin:0 auto; padding:26px 20px 80px; }
  .eyebrow{ font-size:13px; font-weight:700; letter-spacing:0.14em; color:var(--gold); }
  h1{ margin:4px 0 2px; font-size:26px; color:var(--navy); letter-spacing:0.04em; }
  .sub{ font-size:13px; color:var(--navy-light); }
  .titlerow{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .toolbar{ display:flex; flex-wrap:wrap; gap:10px; margin:18px 0 6px; align-items:center; }
  .btn{ font-family:inherit; font-size:13.5px; font-weight:700; padding:10px 16px; border-radius:6px;
        border:1.5px solid var(--paper-line); background:#fff; color:var(--navy); cursor:pointer; }
  .btn:hover{ border-color:var(--gold); }
  .btn--primary{ background:var(--navy); border-color:var(--navy); color:#fff; }
  .btn--primary:hover{ background:var(--navy-light); }
  .btn--danger{ color:var(--danger); }
  .btn--danger:hover{ border-color:var(--danger); }
  .btn--ghost{ background:#fff; color:var(--navy-light); border-color:var(--paper-line); font-size:12.5px; padding:8px 14px; white-space:nowrap; }
  .btn--ghost:hover{ border-color:var(--gold); color:var(--navy); }
  .btn--logout{ color:var(--danger); }
  .btn--logout:hover{ border-color:var(--danger); }
  .sync{ margin-left:auto; font-size:12.5px; color:var(--ok); font-weight:700; }
  .hintbar{ font-size:12.5px; color:var(--navy-light); margin:6px 0 2px; }
  .card{ background:#fff; border:1px solid var(--paper-line); border-radius:10px; margin-top:14px; overflow:auto; }

  table.grid{ border-collapse:collapse; width:100%; min-width:600px; }
  table.grid th, table.grid td{ border:1px solid var(--paper-line); }
  table.grid thead th{ background:#efe9dc; color:var(--navy); font-size:12.5px; padding:8px 6px; text-align:center; position:sticky; top:0; z-index:3; }
  table.grid thead th.room-col{ left:0; z-index:4; text-align:left; padding-left:14px; }
  .date-th{ font-weight:800; }
  .date-th .d-en{ display:block; font-weight:600; color:var(--navy-light); font-size:11px; }
  .halfhead{ font-size:11.5px; color:var(--navy-light); font-weight:700; }
  td.room-name{ background:#faf7f1; font-weight:800; font-size:13px; padding:10px 14px; white-space:nowrap; position:sticky; left:0; z-index:2; border-right:2px solid var(--paper-line); }
  tr.venue-row td{ background:var(--navy); color:#fff; font-weight:800; font-size:13.5px; padding:8px 14px; letter-spacing:0.04em; position:sticky; left:0; }
  .venue-row-inner{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .venue-toggle{ background:rgba(255,255,255,0.12); color:#fff; border:1px solid rgba(255,255,255,0.4);
                 border-radius:5px; font-size:11.5px; padding:3px 11px; cursor:pointer; font-weight:700; white-space:nowrap; }
  .venue-toggle:hover{ background:rgba(255,255,255,0.28); }
  td.slot{ height:52px; min-width:74px; padding:0; vertical-align:middle; cursor:pointer; }
  td.slot.am{ background:var(--am); }
  td.slot.pm{ background:var(--pm); }
  td.slot:hover{ outline:2px solid var(--gold); outline-offset:-2px; }
  td.slot.filled{ background:#fff; }
  td.slot.dragover{ outline:3px dashed var(--gold); outline-offset:-3px; }
  .booking{ height:100%; width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
             padding:4px 6px; border-radius:4px; text-align:center; }
  .booking .org{ font-size:12.5px; font-weight:800; color:var(--navy); line-height:1.25; }
  .booking .note{ font-size:11px; color:var(--navy-light); margin-top:2px; line-height:1.2; }
  .booking:active{ cursor:grabbing; }
  .booking[draggable="true"]{ cursor:grab; }
  .empty-hint{ font-size:11px; color:#c8bfa9; text-align:center; width:100%; }
  .empty{ padding:36px 10px; text-align:center; color:var(--navy-light); font-size:14px; }

  .mask{ position:fixed; inset:0; background:rgba(28,43,58,0.45); display:none; align-items:flex-start; justify-content:center; padding:40px 16px; overflow:auto; z-index:50; }
  .mask.show{ display:flex; }
  .modal{ background:#fff; border-radius:12px; width:560px; max-width:100%; padding:22px 24px; box-shadow:0 12px 40px rgba(0,0,0,0.25); }
  .modal h2{ margin:0 0 14px; font-size:18px; color:var(--navy); display:flex; align-items:center; gap:8px; }
  .f-label{ font-size:12.5px; font-weight:800; color:var(--navy-light); margin:12px 0 4px; }
  .f-input, .f-ta, .f-select{ width:100%; font-family:inherit; font-size:14px; padding:9px 11px; border:1px solid var(--paper-line);
                   border-radius:6px; background:var(--paper); color:var(--ink); outline:none; }
  .f-input:focus, .f-ta:focus, .f-select:focus{ border-color:var(--gold); background:#fff; }
  .row2{ display:flex; gap:10px; }
  .row2 > div{ flex:1; }
  .halfsel{ display:flex; gap:8px; margin-top:6px; }
  .halfsel label{ flex:1; border:1.5px solid var(--paper-line); border-radius:6px; padding:8px; text-align:center; font-size:13px; font-weight:700; cursor:pointer; color:var(--navy-light); }
  .halfsel input{ display:none; }
  .halfsel input:checked + span{ color:var(--navy); }
  .halfsel label:has(input:checked){ border-color:var(--gold); background:#fbf4e4; color:var(--navy); }
  .m-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }
  .m-actions .spacer{ margin-right:auto; }
  .hint{ font-size:12px; color:var(--navy-light); margin-top:3px; }
  .roomlist{ max-height:280px; overflow:auto; border:1px solid var(--paper-line); border-radius:8px; margin-top:8px; }
  .roomlist .grp{ background:#efe9dc; font-size:12.5px; font-weight:800; padding:6px 10px; color:var(--navy); }
  .roomlist .ritem{ display:flex; align-items:center; justify-content:space-between; padding:7px 12px; font-size:13px; border-top:1px solid var(--paper-line); }
  .ritem .del{ color:var(--danger); font-size:12px; font-weight:700; cursor:pointer; border:none; background:none; }
  .ritem .del:hover{ text-decoration:underline; }
  .toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--navy); color:#fff;
          padding:11px 22px; border-radius:8px; font-size:13.5px; font-weight:700; display:none; z-index:99;
          box-shadow:0 6px 24px rgba(0,0,0,0.3); }
  @media (max-width:720px){
    .wrap{ padding:16px 12px 60px; }
    h1{ font-size:20px; }
    .toolbar .btn{ font-size:12px; padding:7px 10px; }
    td.slot{ min-width:64px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="titlerow">
    <div>
      <div class="eyebrow">VIP ROOM USAGE</div>
      <h1>貴賓室使用狀況表</h1>
      <div class="sub">依日期 · 上午/下午為單位 · 同一單位連續使用自動合併 · 團隊即時同步</div>
    </div>
    <button class="btn btn--ghost" id="btn-hide-toolbar">隱藏選項</button>
  </div>

  <div class="toolbar" id="toolbar">
    <button class="btn btn--primary" id="btn-add">＋ 新增使用單位</button>
    <button class="btn" id="btn-rooms">🏛 貴賓室設定</button>
    <button class="btn" id="btn-daterange">📅 展覽日期設定</button>
    <button class="btn btn--danger" id="btn-clear">🗑 清空全部資料</button>
    <button class="btn btn--ghost btn--logout" id="btn-logout">🔓 登出</button>
    <span class="sync" id="sync-status">● 連線中…</span>
  </div>
  <div class="hintbar">💡 點空格可新增使用單位；點已填格可編輯／刪除；直接拖曳已填格子可搬移到其他日期或貴賓室。</div>

  <div class="card"><div id="grid-holder"></div></div>
</div>

<!-- 新增/編輯使用單位 -->
<div class="mask" id="mask-book">
  <div class="modal">
    <h2 id="book-modal-title">新增使用單位</h2>

    <div class="f-label">使用單位／貴賓名稱</div>
    <input type="text" class="f-input" id="f-org" placeholder="例如：外貿協會貴賓、王小明先生">

    <div class="f-label">貴賓室</div>
    <select class="f-select" id="f-room"></select>

    <div class="f-label">開始</div>
    <div class="row2">
      <div><input type="date" class="f-input" id="f-start-date" min="2020-01-01" max="2099-12-31"></div>
      <div class="halfsel">
        <label><input type="radio" name="f-start-half" value="am" checked><span>上午</span></label>
        <label><input type="radio" name="f-start-half" value="pm"><span>下午</span></label>
      </div>
    </div>

    <div class="f-label">結束（單一時段可與開始相同）</div>
    <div class="row2">
      <div><input type="date" class="f-input" id="f-end-date" min="2020-01-01" max="2099-12-31"></div>
      <div class="halfsel">
        <label><input type="radio" name="f-end-half" value="am" checked><span>上午</span></label>
        <label><input type="radio" name="f-end-half" value="pm"><span>下午</span></label>
      </div>
    </div>

    <div class="f-label">備註</div>
    <textarea class="f-ta" id="f-note" rows="2" placeholder="選填，例如：需準備茶水"></textarea>

    <div class="m-actions">
      <button class="btn btn--danger spacer" id="book-delete" style="display:none;">刪除</button>
      <button class="btn" id="book-cancel">取消</button>
      <button class="btn btn--primary" id="book-save">儲存</button>
    </div>
  </div>
</div>

<!-- 貴賓室設定 -->
<div class="mask" id="mask-rooms">
  <div class="modal">
    <h2>🏛 貴賓室設定</h2>
    <div class="f-label">場館／樓層名稱</div>
    <input type="text" class="f-input" id="r-venue" placeholder="例如：南港一館(1F)">
    <div class="f-label">貴賓室名稱</div>
    <input type="text" class="f-input" id="r-name" placeholder="例如：第1貴賓室">
    <div class="m-actions" style="margin-top:10px;">
      <button class="btn btn--primary spacer" id="r-add">＋ 新增貴賓室</button>
    </div>
    <div class="f-label">目前貴賓室列表</div>
    <div class="roomlist" id="roomlist"></div>
    <div class="m-actions">
      <button class="btn" id="rooms-close">關閉</button>
    </div>
  </div>
</div>

<!-- 展覽日期設定 -->
<div class="mask" id="mask-range">
  <div class="modal" style="width:420px;">
    <h2>📅 展覽日期設定</h2>
    <div class="f-label">展覽第一天</div>
    <input type="date" class="f-input" id="rg-start" min="2020-01-01" max="2099-12-31">
    <div class="f-label">展覽天數</div>
    <input type="number" class="f-input" id="rg-days" min="1" max="30" step="1" value="4">
    <div class="hint" id="rg-preview" style="margin-top:6px; font-weight:700; color:var(--gold);"></div>
    <div class="hint">表格只會顯示這幾天的格子，不會出現其他日期（內建預設 4 天，可自行增減）。</div>
    <div class="m-actions">
      <button class="btn" id="rg-cancel">取消</button>
      <button class="btn btn--primary" id="rg-save">儲存</button>
    </div>
  </div>
</div>

<!-- 密碼驗證 -->
<div class="mask" id="mask-pw">
  <div class="modal" style="width:400px; text-align:center;">
    <h2 style="justify-content:center;">🔒 需要驗證</h2>
    <div class="sub" style="margin-bottom:14px;">此操作需要工作人員密碼</div>
    <input type="password" class="f-input" id="pw-input" autocomplete="off"
           style="text-align:center; letter-spacing:6px; font-size:18px;">
    <div class="hint" id="pw-err" style="color:var(--danger); font-weight:700; min-height:16px; margin-top:6px;"></div>
    <div class="m-actions" style="justify-content:center;">
      <button class="btn" id="pw-cancel">取消</button>
      <button class="btn btn--primary" id="pw-ok">確認</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, update, remove, onValue, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

/* ── Firebase：與 Gurus / 日程表同一個專案，資料鎖在獨立節點 vipRoomTool ── */
const firebaseConfig = {
  apiKey: "AIzaSyDM9gqNxouPzNvj1EPtzVL1QMeH2wfEv6s",
  authDomain: "gurus-cfa66.firebaseapp.com",
  databaseURL: "https://gurus-cfa66-default-rtdb.firebaseio.com",
  projectId: "gurus-cfa66",
  storageBucket: "gurus-cfa66.firebasestorage.app",
  messagingSenderId: "584897610628",
  appId: "1:584897610628:web:d5d7331c022c3b1a3493d1"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const ROOM_REF = ref(db, 'vipRoomTool/rooms');
const BOOK_REF = ref(db, 'vipRoomTool/bookings');
const SET_REF  = ref(db, 'vipRoomTool/settings');

let ROOMS = {};     // id -> {venue, name, order}
let BOOKINGS = {};  // id -> {roomId, date, half, org, note, updatedAt}
let RANGE_START = '';
let RANGE_DAYS = 4; // 展覽天數：預設 4 天，可在「展覽日期設定」調整
let roomsLoaded = false, bookingsLoaded = false;

const $ = id => document.getElementById(id);
const esc = s => { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; };
const nl2br = s => esc(s).replace(/\n/g, '<br>');

/* ── 預設貴賓室（Firebase 尚無資料時的起始樣板） ── */
const DEFAULT_ROOMS = [
  { venue: '南港一館', name: '(1F) 第1貴賓室', order: 1 },
  { venue: '南港一館', name: '(1F) 第2貴賓室', order: 2 },
  { venue: '南港一館', name: '(1F) 第5貴賓室', order: 3 },
  { venue: '南港一館', name: '(4F) 第3貴賓室', order: 4 },
  { venue: '南港一館', name: '(4F) 第4貴賓室', order: 5 },
  { venue: '南港一館', name: '(4F) 貴賓簡報室', order: 6 },
  { venue: '南港二館', name: '(1F) 第1貴賓室', order: 1 },
  { venue: '南港二館', name: '(1F) 多功能會議室', order: 2 },
  { venue: '南港二館', name: '(4F) 第2貴賓室', order: 3 }
];

/* ── 工作人員密碼驗證 ── */
const STAFF_PW = '2870';
let pwPending = null;
const isLoggedIn = () => sessionStorage.getItem('vipPwOk') === '1';
function requirePw(cb){
  if (isLoggedIn()) { cb(); return; }
  pwPending = cb;
  $('pw-input').value = '';
  $('pw-err').textContent = '';
  $('mask-pw').classList.add('show');
  setTimeout(() => $('pw-input').focus(), 50);
}
function pwSubmit(){
  if ($('pw-input').value === STAFF_PW) {
    sessionStorage.setItem('vipPwOk', '1');
    $('mask-pw').classList.remove('show');
    const cb = pwPending; pwPending = null;
    if (cb) cb();
  } else {
    $('pw-err').textContent = '密碼錯誤，請再試一次';
    $('pw-input').value = '';
    $('pw-input').focus();
  }
}
function doLogout(){
  sessionStorage.removeItem('vipPwOk');
  toast('已登出');
}

/* ── 場館隱藏（個人瀏覽器偏好，不影響其他人／不影響資料） ── */
function loadHiddenVenues(){
  try { return JSON.parse(localStorage.getItem('vipHiddenVenues') || '[]'); }
  catch(_) { return []; }
}
let HIDDEN_VENUES = loadHiddenVenues();
function isVenueHidden(venue){ return HIDDEN_VENUES.includes(venue); }
function toggleVenue(venue){
  HIDDEN_VENUES = isVenueHidden(venue) ? HIDDEN_VENUES.filter(v => v !== venue) : [...HIDDEN_VENUES, venue];
  localStorage.setItem('vipHiddenVenues', JSON.stringify(HIDDEN_VENUES));
  render();
}

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = 'none', 2200);
}

/* ── 日期工具 ── */
const WD_ZH = '日一二三四五六';
function dateZhShort(iso){
  const d = new Date(iso + 'T00:00:00');
  if (isNaN(d)) return iso;
  return `${d.getMonth() + 1}/${d.getDate()}(${WD_ZH[d.getDay()]})`;
}
function toIsoLocal(d){
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function addDays(iso, n){
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return toIsoLocal(d);
}
function todayIso(){ return toIsoLocal(new Date()); }

/* ── 日期＋半天 = 時段序列 ── */
function buildSlots(){
  const start = RANGE_START || todayIso();
  const end = addDays(start, (RANGE_DAYS || 4) - 1);
  const slots = [];
  let cur = start;
  let guard = 0;
  while (cur <= end && guard < 400) {
    slots.push({ date: cur, half: 'am' });
    slots.push({ date: cur, half: 'pm' });
    cur = addDays(cur, 1);
    guard++;
  }
  return slots;
}
function slotKey(date, half){ return date + '_' + half; }

/* ── 房間排序 & 分組 ── */
function orderedRooms(){
  return Object.entries(ROOMS)
    .map(([id, r]) => ({ id, ...r }))
    .sort((a, b) => (a.venue || '').localeCompare(b.venue, 'zh-Hant') || (a.order || 0) - (b.order || 0));
}
function groupByVenue(rooms){
  const groups = [];
  rooms.forEach(r => {
    let g = groups.find(g => g.venue === r.venue);
    if (!g) { g = { venue: r.venue, rooms: [] }; groups.push(g); }
    g.rooms.push(r);
  });
  return groups;
}

/* ── 依房間整理 bookings 索引：roomId -> { 'date_half': bookingId } ── */
function bookingIndex(){
  const idx = {};
  Object.entries(BOOKINGS).forEach(([id, b]) => {
    if (!b || !b.roomId || !b.date || !b.half) return;
    (idx[b.roomId] ||= {})[slotKey(b.date, b.half)] = id;
  });
  return idx;
}

/* ── 畫面渲染 ── */
function render(){
  const holder = $('grid-holder');
  const rooms = orderedRooms();
  if (rooms.length === 0) {
    holder.innerHTML = `<div class="empty">還沒有貴賓室。點上方「🏛 貴賓室設定」新增。</div>`;
    return;
  }
  const slots = buildSlots();
  const dates = [...new Set(slots.map(s => s.date))];
  const idx = bookingIndex();
  const groups = groupByVenue(rooms);

  let html = `<table class="grid"><thead>
    <tr><th class="room-col" rowspan="2">貴賓室</th>
      ${dates.map(d => `<th class="date-th" colspan="2">${esc(dateZhShort(d))}</th>`).join('')}
    </tr>
    <tr>${dates.map(() => `<th class="halfhead">上午</th><th class="halfhead">下午</th>`).join('')}</tr>
  </thead><tbody>`;

  groups.forEach(g => {
    const hidden = isVenueHidden(g.venue);
    html += `<tr class="venue-row"><td colspan="${1 + dates.length * 2}">
      <div class="venue-row-inner">
        <span>${esc(g.venue)}</span>
        <button class="venue-toggle" data-venue="${esc(g.venue)}">${hidden ? '👁 顯示' : '🚫 隱藏'}</button>
      </div>
    </td></tr>`;
    if (hidden) return;
    g.rooms.forEach(room => {
      html += `<tr><td class="room-name">${esc(room.name)}</td>`;
      const roomIdx = idx[room.id] || {};
      let i = 0;
      while (i < slots.length) {
        const s = slots[i];
        const bId = roomIdx[slotKey(s.date, s.half)];
        if (!bId) {
          html += `<td class="slot ${s.half}" data-room="${room.id}" data-date="${s.date}" data-half="${s.half}"></td>`;
          i++;
          continue;
        }
        const b = BOOKINGS[bId];
        // 往後合併：只要下一個時段也存在、org 與 note 相同，就合併同一格
        let span = 1;
        const ids = [bId];
        while (i + span < slots.length) {
          const ns = slots[i + span];
          const nId = roomIdx[slotKey(ns.date, ns.half)];
          if (!nId) break;
          const nb = BOOKINGS[nId];
          if ((nb.org || '') !== (b.org || '') || (nb.note || '') !== (b.note || '')) break;
          ids.push(nId);
          span++;
        }
        const endSlot = slots[i + span - 1];
        html += `<td class="slot ${s.half} filled" colspan="${span}"
            data-room="${room.id}" data-date="${s.date}" data-half="${s.half}"
            data-end-date="${endSlot.date}" data-end-half="${endSlot.half}"
            data-ids="${ids.join(',')}" data-org="${esc(b.org || '')}" data-note="${esc(b.note || '')}">
            <div class="booking" draggable="true">
              <div class="org">${esc(b.org || '')}</div>
              ${b.note ? `<div class="note">${nl2br(b.note)}</div>` : ''}
            </div>
          </td>`;
        i += span;
      }
      html += `</tr>`;
    });
  });
  html += `</tbody></table>`;
  holder.innerHTML = html;
  bindGridEvents();
}

function bindGridEvents(){
  const holder = $('grid-holder');
  holder.querySelectorAll('.venue-toggle').forEach(btn => {
    btn.addEventListener('click', () => toggleVenue(btn.dataset.venue));
  });
  holder.querySelectorAll('td.slot').forEach(td => {
    if (!td.classList.contains('filled')) {
      td.addEventListener('click', () => requirePw(() => openBookingModal({
        room: td.dataset.room, date: td.dataset.date, half: td.dataset.half
      })));
    } else {
      td.addEventListener('click', () => requirePw(() => openBookingModal({
        room: td.dataset.room, date: td.dataset.date, half: td.dataset.half,
        endDate: td.dataset.endDate, endHalf: td.dataset.endHalf,
        org: td.dataset.org, note: td.dataset.note, ids: td.dataset.ids.split(',')
      })));
      const b = td.querySelector('.booking');
      b.addEventListener('dragstart', e => {
        e.dataTransfer.setData('text/plain', JSON.stringify({
          ids: td.dataset.ids.split(','), org: td.dataset.org, note: td.dataset.note,
          length: parseInt(td.getAttribute('colspan') || '1', 10)
        }));
      });
    }
    td.addEventListener('dragover', e => { e.preventDefault(); td.classList.add('dragover'); });
    td.addEventListener('dragleave', () => td.classList.remove('dragover'));
    td.addEventListener('drop', e => {
      e.preventDefault();
      td.classList.remove('dragover');
      let payload;
      try { payload = JSON.parse(e.dataTransfer.getData('text/plain')); } catch(_) { return; }
      if (!payload || !payload.ids) return;
      requirePw(() => moveGroup(payload, td.dataset.room, td.dataset.date, td.dataset.half));
    });
  });
}

/* ── 依開始時段＋筆數，往後推出完整時段清單 ── */
function slotsFrom(startDate, startHalf, count){
  const all = [];
  let cur = startDate, half = startHalf;
  for (let n = 0; n < count; n++) {
    all.push({ date: cur, half });
    if (half === 'am') { half = 'pm'; }
    else { half = 'am'; cur = addDays(cur, 1); }
  }
  return all;
}
/* ── 依開始/結束日期時段，算出時段清單 ── */
function slotsBetween(startDate, startHalf, endDate, endHalf){
  const list = [];
  let cur = startDate, half = startHalf;
  let guard = 0;
  while (guard < 400) {
    list.push({ date: cur, half });
    if (cur === endDate && half === endHalf) break;
    if (half === 'am') { half = 'pm'; }
    else { half = 'am'; cur = addDays(cur, 1); }
    guard++;
    if (cur > endDate) break; // 保護：結束比開始早的異常輸入
  }
  return list;
}

async function moveGroup(payload, targetRoom, targetDate, targetHalf){
  const wanted = slotsFrom(targetDate, targetHalf, payload.length);
  // 檢查目標時段是否已被「非本群組」的其他預約占用
  const idx = bookingIndex();
  const roomIdx = idx[targetRoom] || {};
  for (const s of wanted) {
    const occ = roomIdx[slotKey(s.date, s.half)];
    if (occ && !payload.ids.includes(occ)) {
      toast('✗ 搬移失敗：目標時段已被其他單位使用');
      render();
      return;
    }
  }
  try {
    const updates = {};
    payload.ids.forEach(id => { updates['vipRoomTool/bookings/' + id] = null; });
    await update(ref(db), updates);
    for (const s of wanted) {
      await push(BOOK_REF, { roomId: targetRoom, date: s.date, half: s.half, org: payload.org, note: payload.note, updatedAt: Date.now() });
    }
    toast('✓ 已搬移');
  } catch (e) { toast('✗ 搬移失敗：' + e.message); render(); }
}

/* ── 新增/編輯使用單位 ── */
let editingIds = null;
function openBookingModal(pre){
  editingIds = pre.ids || null;
  $('book-modal-title').textContent = editingIds ? '編輯使用單位' : '新增使用單位';
  $('book-delete').style.display = editingIds ? 'inline-block' : 'none';
  $('f-org').value = pre.org || '';
  $('f-note').value = pre.note || '';
  fillRoomSelect(pre.room);
  $('f-start-date').value = pre.date;
  document.querySelector(`input[name="f-start-half"][value="${pre.half}"]`).checked = true;
  $('f-end-date').value = pre.endDate || pre.date;
  document.querySelector(`input[name="f-end-half"][value="${pre.endHalf || pre.half}"]`).checked = true;
  $('mask-book').classList.add('show');
}
function fillRoomSelect(selectedId){
  const sel = $('f-room');
  sel.innerHTML = '';
  groupByVenue(orderedRooms()).forEach(g => {
    const og = document.createElement('optgroup');
    og.label = g.venue;
    g.rooms.forEach(r => {
      const opt = document.createElement('option');
      opt.value = r.id; opt.textContent = r.name;
      if (r.id === selectedId) opt.selected = true;
      og.appendChild(opt);
    });
    sel.appendChild(og);
  });
}
$('btn-add').addEventListener('click', () => requirePw(() => openBookingModal({
  room: orderedRooms()[0]?.id || '', date: todayIso(), half: 'am'
})));
$('book-cancel').addEventListener('click', () => $('mask-book').classList.remove('show'));
$('book-save').addEventListener('click', async () => {
  const org = $('f-org').value.trim();
  if (!org) { alert('請填使用單位／貴賓名稱'); return; }
  const roomId = $('f-room').value;
  if (!roomId) { alert('請先建立貴賓室'); return; }
  const startDate = $('f-start-date').value;
  const startHalf = document.querySelector('input[name="f-start-half"]:checked').value;
  const endDate = $('f-end-date').value || startDate;
  const endHalf = document.querySelector('input[name="f-end-half"]:checked').value;
  if (!startDate || !endDate) { alert('請選日期'); return; }
  if (endDate < startDate || (endDate === startDate && endHalf === 'am' && startHalf === 'pm')) {
    alert('結束時段不能早於開始時段'); return;
  }
  const note = $('f-note').value.trim();
  const wanted = slotsBetween(startDate, startHalf, endDate, endHalf);
  const idx = bookingIndex();
  const roomIdx = idx[roomId] || {};
  const excludeIds = editingIds || [];
  for (const s of wanted) {
    const occ = roomIdx[slotKey(s.date, s.half)];
    if (occ && !excludeIds.includes(occ)) {
      alert('該時段已被其他單位使用，請換一個時段或貴賓室');
      return;
    }
  }
  try {
    const updates = {};
    if (editingIds) editingIds.forEach(id => { updates['vipRoomTool/bookings/' + id] = null; });
    if (Object.keys(updates).length) await update(ref(db), updates);
    for (const s of wanted) {
      await push(BOOK_REF, { roomId, date: s.date, half: s.half, org, note, updatedAt: Date.now() });
    }
    $('mask-book').classList.remove('show');
    toast('✓ 已儲存並同步');
  } catch (e) { toast('✗ 儲存失敗：' + e.message); }
});
$('book-delete').addEventListener('click', async () => {
  if (!editingIds) return;
  if (!confirm('確定刪除這筆使用紀錄？')) return;
  try {
    const updates = {};
    editingIds.forEach(id => { updates['vipRoomTool/bookings/' + id] = null; });
    await update(ref(db), updates);
    $('mask-book').classList.remove('show');
    toast('✓ 已刪除');
  } catch (e) { toast('✗ 刪除失敗：' + e.message); }
});

/* ── 貴賓室設定 ── */
$('btn-rooms').addEventListener('click', () => requirePw(() => {
  $('r-venue').value = ''; $('r-name').value = '';
  renderRoomList();
  $('mask-rooms').classList.add('show');
}));
$('rooms-close').addEventListener('click', () => $('mask-rooms').classList.remove('show'));
function renderRoomList(){
  const box = $('roomlist');
  const groups = groupByVenue(orderedRooms());
  if (groups.length === 0) { box.innerHTML = `<div class="ritem">尚未建立任何貴賓室</div>`; return; }
  box.innerHTML = groups.map(g => `
    <div class="grp">${esc(g.venue)}</div>
    ${g.rooms.map(r => `
      <div class="ritem">
        <span>${esc(r.name)}</span>
        <button class="del" data-del-room="${r.id}">刪除</button>
      </div>`).join('')}
  `).join('');
  box.querySelectorAll('[data-del-room]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.delRoom;
      const hasBookings = Object.values(BOOKINGS).some(b => b && b.roomId === id);
      const msg = hasBookings
        ? '這間貴賓室還有使用紀錄，刪除後該房間的所有紀錄也會一併移除，確定嗎？'
        : '確定刪除這間貴賓室？';
      if (!confirm(msg)) return;
      try {
        const updates = { ['vipRoomTool/rooms/' + id]: null };
        Object.entries(BOOKINGS).forEach(([bid, b]) => { if (b && b.roomId === id) updates['vipRoomTool/bookings/' + bid] = null; });
        await update(ref(db), updates);
        toast('✓ 已刪除貴賓室');
        renderRoomList();
      } catch (e) { toast('✗ 刪除失敗：' + e.message); }
    });
  });
}
$('r-add').addEventListener('click', async () => {
  const venue = $('r-venue').value.trim();
  const name = $('r-name').value.trim();
  if (!venue || !name) { alert('請填場館與貴賓室名稱'); return; }
  const sameVenueCount = Object.values(ROOMS).filter(r => r.venue === venue).length;
  try {
    await push(ROOM_REF, { venue, name, order: sameVenueCount + 1, updatedAt: Date.now() });
    $('r-name').value = '';
    toast('✓ 已新增貴賓室');
    renderRoomList();
  } catch (e) { toast('✗ 新增失敗：' + e.message); }
});

/* ── 展覽日期設定：第一天 + 天數（預設 4 天，可調整） ── */
function updateRgPreview(){
  const s = $('rg-start').value;
  const days = parseInt($('rg-days').value, 10) || 1;
  if (!s) { $('rg-preview').textContent = ''; return; }
  const e = addDays(s, days - 1);
  $('rg-preview').textContent = `展覽期間：${dateZhShort(s)} ～ ${dateZhShort(e)}（共 ${days} 天）`;
}
$('rg-start').addEventListener('input', updateRgPreview);
$('rg-days').addEventListener('input', updateRgPreview);
$('btn-daterange').addEventListener('click', () => requirePw(() => {
  $('rg-start').value = RANGE_START || todayIso();
  $('rg-days').value = RANGE_DAYS || 4;
  updateRgPreview();
  $('mask-range').classList.add('show');
}));
$('rg-cancel').addEventListener('click', () => $('mask-range').classList.remove('show'));
$('rg-save').addEventListener('click', async () => {
  const s = $('rg-start').value;
  const days = parseInt($('rg-days').value, 10);
  if (!s) { alert('請選展覽第一天'); return; }
  if (!days || days < 1) { alert('展覽天數至少要 1 天'); return; }
  try {
    await update(SET_REF, { startDate: s, days, updatedAt: Date.now() });
    $('mask-range').classList.remove('show');
    toast('✓ 展覽日期已更新');
  } catch (err) { toast('✗ 更新失敗：' + err.message); }
});

/* ── 清空全部資料 ── */
$('btn-clear').addEventListener('click', () => requirePw(async () => {
  if (!confirm('確定清空「貴賓室使用狀況表」全部資料？（貴賓室、日期設定與所有使用紀錄都會刪除）')) return;
  if (!confirm('再確認一次：這個動作無法復原，所有同事看到的資料也會一起消失。')) return;
  try { await remove(ref(db, 'vipRoomTool')); toast('✓ 已清空，容量已釋放'); }
  catch (e) { toast('✗ 清空失敗：' + e.message); }
}));

/* ── 登出 / 隱藏選項 ── */
$('btn-logout').addEventListener('click', doLogout);
function applyToolbarVisibility(){
  const hidden = localStorage.getItem('vipToolbarHidden') === '1';
  $('toolbar').style.display = hidden ? 'none' : 'flex';
  $('btn-hide-toolbar').textContent = hidden ? '顯示選項' : '隱藏選項';
}
$('btn-hide-toolbar').addEventListener('click', () => {
  const hidden = localStorage.getItem('vipToolbarHidden') === '1';
  localStorage.setItem('vipToolbarHidden', hidden ? '0' : '1');
  applyToolbarVisibility();
});
applyToolbarVisibility();

/* ── 密碼 modal 綁定 ── */
$('pw-cancel').addEventListener('click', () => { pwPending = null; $('mask-pw').classList.remove('show'); });
$('pw-ok').addEventListener('click', pwSubmit);
$('pw-input').addEventListener('keydown', e => { if (e.key === 'Enter') pwSubmit(); });

/* ── 即時同步 ── */
function maybeSeedDefaults(){
  if (roomsLoaded && Object.keys(ROOMS).length === 0) {
    DEFAULT_ROOMS.forEach(r => push(ROOM_REF, { ...r, updatedAt: Date.now() }));
  }
}
onValue(ROOM_REF, snap => {
  ROOMS = snap.val() || {};
  roomsLoaded = true;
  if (Object.keys(ROOMS).length === 0) maybeSeedDefaults();
  render();
}, err => { $('sync-status').textContent = '✗ 連線失敗'; console.error(err); });
onValue(BOOK_REF, snap => {
  BOOKINGS = snap.val() || {};
  bookingsLoaded = true;
  $('sync-status').textContent = '● 即時同步 · ' + Object.keys(BOOKINGS).length + ' 筆紀錄';
  render();
});
onValue(SET_REF, snap => {
  const s = snap.val() || {};
  RANGE_START = s.startDate || '';
  RANGE_DAYS = s.days || 4;
  render();
});
</script>
